functionsDirectory = "D:\\gp website\\netlify\\functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "D:\\gp website\\web\\dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build:netlify"
base = "D:\\gp website"
functions = "D:\\gp website\\netlify\\functions"

[build.environment]
NODE_VERSION = "22"
NETLIFY = "true"
USE_NETLIFY_BLOBS = "1"
ALLOW_NETLIFY_ORIGINS = "1"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions.api]
timeout = 26.0
node_bundler = "esbuild"

[functions."*"]
included_files = ["server/**"]
node_bundler = "esbuild"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api"
status = 200.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/uploads/*"
to = "/.netlify/functions/api"
status = 200.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]