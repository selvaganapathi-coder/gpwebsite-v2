<body data-page="achievements">
<div id="site-root">

  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Achievements</div>
      <h1 class="page-hero__title">Student Achievements</h1>
      <p class="page-hero__subtitle">Celebrating excellence in academics, research, placements, sports &amp; more</p>
    </div>
  </section>

  <section class="section achievements-section">
    <div class="container">
      <div class="achievement-category-bar fade-up">
        <button type="button" class="achievement-filter achievement-filter--active" data-achievement-filter="all">All</button>
        <button type="button" class="achievement-filter" data-achievement-filter="rank">🏆 University Rank</button>
        <button type="button" class="achievement-filter" data-achievement-filter="academic">🥇 Academic Excellence</button>

        <button type="button" class="achievement-filter" data-achievement-filter="sports">🏅 Sports</button>
        <button type="button" class="achievement-filter" data-achievement-filter="certification">📜 Certification</button>
      </div>

      <div class="achievements-grid fade-up" id="achievementsGrid"></div>

      <p class="achievement-erp-note fade-up">🔌 Achievement records will sync from ERP when connected</p>
